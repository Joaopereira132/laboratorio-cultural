{% extends "base.html" %}

{% block title %}Erro {{ codigo }} - Laboratório Cultural{% endblock %}

{% block content %}
<section style="max-width: 640px; margin: 0 auto; padding: 6rem 1.5rem; text-align: center;">
    <p style="font-size: 4rem; font-weight: 900; color: #F39200; margin: 0;">{{ codigo }}</p>
    <h1 style="font-size: 1.5rem; margin: 0.5rem 0 1.5rem 0;">{{ mensagem }}</h1>
    <a href="{{ url_for('lab_cultural') }}" style="display: inline-block; background: #F39200; color: #1a1a1a; padding: 12px 24px; border-radius: 6px; font-weight: 700; text-decoration: none;">Voltar ao início</a>
</section>
{% endblock %}
